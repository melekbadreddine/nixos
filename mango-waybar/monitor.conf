# Monitor rules
# DP-1 - Left monitor (ultrawide)
monitorrule=name:^DP-1$,width:3440,height:1440,refresh:180,x:0,y:252,scale:1,rr:0

# HDMI-A-1 - Middle monitor (portrait)
monitorrule=name:^HDMI-A-1$,width:1920,height:1080,refresh:60,x:3440,y:0,scale:1,rr:1

# DP-2 - Right monitor (ultrawide)
monitorrule=name:^DP-2$,width:3440,height:1440,refresh:180,x:4520,y:252,scale:1,rr:0
