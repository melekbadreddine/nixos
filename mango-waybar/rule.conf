# Window Rules for Mango

# Floating kitty window - smaller size (800x600)
windowrule=isfloating:1,width:900,height:600,title:floating-kitty

# OBS Studio - always open at 0.7 width in scroller layout
# windowrule=scroller_proportion:0.7,appid:com.obsproject.Studio

# Steam - idle inhibit when focused (prevents screen lock during gameplay)
windowrule=indleinhibit_when_focus:1,appid:steam
windowrule=scroller_proportion:1.0,appid:steam

# The Finals - fixed size tile window
windowrule=width:2520,height:1309,appid:steam_app_2073850

# Morbid Metal - fixed size tile window
windowrule=width:2520,height:1309,appid:steam_app_2067920

# Discord - always floating on HDMI-A-1 (top-left area)
windowrule=monitor:HDMI-A-1,appid:discord

# Telegram - always floating on HDMI-A-1 (bottom-left area)
windowrule=monitor:HDMI-A-1,appid:org.telegram.desktop

# OBS Monitor DP-2
windowrule=monitor:DP-2,appid:com.obsproject.Studio

# Wallpaper picker - always floating
windowrule=isfloating:1,title:Wallpaper Picker
