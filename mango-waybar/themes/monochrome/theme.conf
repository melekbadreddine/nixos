# Theme: Monochrome
# Minimal black and white theme for Mango WM

THEME_NAME="Monochrome"

# ─── Base Colors ───
BG="#0a0a0a"
FG="#e0e0e0"
PRIMARY="#ffffff"
SECONDARY="#b0b0b0"
TERTIARY="#808080"
ACCENT="#ffffff"
ERROR="#ff4444"
SURFACE="#1a1a1a"
OUTLINE="#333333"
SHADOW="#000000"
WARNING="#ffaa00"
SUCCESS="#44ff44"
HOVER="#2a2a2a"
BG_ALT="#050505"
ORANGE="#ff8800"

# ─── Terminal Colors ───
BLACK="#1a1a1a"
RED="#cc4444"
GREEN="#44aa44"
YELLOW="#ccaa44"
BLUE="#4488cc"
MAGENTA="#aa44aa"
CYAN="#44aaaa"
WHITE="#aaaaaa"
BLACKB="#555555"
REDB="#ff6666"
GREENB="#66cc66"
YELLOWB="#ddcc66"
BLUEB="#66aadd"
MAGENTAB="#cc66cc"
CYANB="#66cccc"
WHITEB="#cccccc"

# ─── GTK / Icons ───
GTK_THEME="Graphite-Dark"
ICON_THEME="Tela-grey-dark"
CURSOR_THEME="Bibata-Modern-Ice"
CURSOR_SIZE=24
GTK_FONT="Adwaita Sans 11"

# ─── Mango WM ───
MANGO_BORDER_FOCUSED="#ffffff"
MANGO_BORDER_NORMAL="#1a1a1a"
MANGO_BORDER_WIDTH=2
MANGO_BORDER_RADIUS=6

# ─── Bar ───
BAR_NAME="full"

# ─── Wallpaper ───
WALLPAPER_DEFAULT="moon-knight.jpg"

# ─── Zed Editor ───
ZED_THEME="One Dark - Darkened"

# ─── Qt ───
QT_COLOR_SCHEME="monochrome"
