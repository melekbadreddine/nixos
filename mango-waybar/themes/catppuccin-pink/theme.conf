# Theme: Catppuccin Pink
# Catppuccin Mocha with pink accents for Mango WM

THEME_NAME="Catppuccin Pink"

# ─── Base Colors ───
BG="#1e1e2e"
FG="#cdd6f4"
PRIMARY="#f5c2e7"
SECONDARY="#cba6f7"
TERTIARY="#b4befe"
ACCENT="#f5c2e7"
ERROR="#f38ba8"
SURFACE="#313244"
OUTLINE="#45475a"
SHADOW="#181825"
WARNING="#f9e2af"
SUCCESS="#a6e3a1"
HOVER="#f5c2e7"
BG_ALT="#181825"
ORANGE="#fab387"

# ─── Terminal Colors ───
BLACK="#45475a"
RED="#f38ba8"
GREEN="#a6e3a1"
YELLOW="#f9e2af"
BLUE="#89b4fa"
MAGENTA="#cba6f7"
CYAN="#89dceb"
WHITE="#cdd6f4"
BLACKB="#585b70"
REDB="#f38ba8"
GREENB="#a6e3a1"
YELLOWB="#f9e2af"
BLUEB="#89b4fa"
MAGENTAB="#cba6f7"
CYANB="#89dceb"
WHITEB="#bac2de"

# ─── GTK / Icons ───
GTK_THEME="catppuccin-mocha-pink-standard+default"
ICON_THEME="Tela-pink-dark"
CURSOR_THEME="Bibata-Modern-Ice"
CURSOR_SIZE=24
GTK_FONT="Adwaita Sans 11"

# ─── Mango WM ───
MANGO_BORDER_FOCUSED="#f5c2e7"
MANGO_BORDER_NORMAL="#1e1e2e"
MANGO_BORDER_WIDTH=2
MANGO_BORDER_RADIUS=6

# ─── Bar ───
BAR_NAME="full"

# ─── Wallpaper ───
WALLPAPER_DEFAULT="car-1.png"

# ─── Zed Editor ───
ZED_THEME="Catppuccin Mocha"

# ─── Qt ───
QT_COLOR_SCHEME="catppuccin-pink"
