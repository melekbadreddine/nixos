# TheBlackDon's Binds

# ============================================
# System
# ============================================
bind=SUPER+ALT,r,spawn,$HOME/.config/mango/bin/reload.sh
bind=SUPER+ALT,l,spawn,qs -c noctalia-shell ipc call lockScreen lock
bind=SUPER,m,quit
bind=SUPER,q,killclient,
bind=SUPER+SHIFT,q,spawn,wlogout

# Theme picker
bind=SUPER+SHIFT,t,spawn,$HOME/.config/mango/bin/switch-theme.sh
# Wallpaper picker (current theme)
bind=SUPER+SHIFT,w,spawn,$HOME/.config/mango/bin/wall-select.sh

# ============================================
# Controller / Gaming
# ============================================
bind=SUPER,T,spawn,$HOME/.config/mango/bin/toggle-dualsense-touchpad.sh

# ============================================
# Applications (matching niri)
# ============================================
bind=SUPER,Return,spawn,kitty
bind=SUPER+CTRL,Return,spawn,kitty -T floating-kitty
# bind=SUPER,Space,spawn,qs -c noctalia-shell ipc call launcher toggle
bind=SUPER,Space,spawn,wofi -S drun -I -W 600 -H 400 -l center -p "  Search apps..." -s ~/.config/mango/wofi/style.css

# App launchers
bind=SUPER,S,spawn,steam
bind=SUPER,O,spawn,obs
bind=SUPER,Z,spawn,zed
bind=SUPER,E,spawn,kitty -e hx
bind=SUPER,Y,spawn,kitty -T floating-kitty -e yazi
bind=SUPER,D,spawn,discord
bind=SUPER,G,spawn,Telegram
bind=SUPER,B,spawn,helium
bind=SUPER+ALT,B,spawn,qutebrowser
bind=SUPER,K,spawn,kdenlive
bind=SUPER,F,spawn,nemo
bind=SUPER+ALT,v,spawn,kitty -T floating-kitty vm-curator

# Mango emoji picker
bind=SUPER+ALT,E,spawn,python3 $HOME/.config/mango/bin/emoji-picker.py

# ============================================
# Window Focus (SUPER + Arrows - like niri)
# ============================================
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# ============================================
# Window Movement (SUPER + Shift + Arrows)
# ============================================
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# Mouse Window Movement
axisbind=SUPER+ALT,UP,focusdir,left
axisbind=SUPER+ALT,DOWN,focusdir,right

# ============================================
# Workspace Navigation (Tags as Workspaces)
# ============================================
# Switch workspaces up/down
bind=SUPER+CTRL,Up,viewtoleft,0
bind=SUPER+CTRL,Down,viewtoright,0

# Move window to adjacent workspace
bind=SUPER+CTRL+ALT,Up,tagtoleft,0
bind=SUPER+CTRL+ALT,Down,tagtoright,0

# Mouse wheel workspace navigation
axisbind=SUPER,UP,viewtoleft
axisbind=SUPER,DOWN,viewtoright
axisbind=SUPER+CTRL,UP,tagtoleft
axisbind=SUPER+CTRL,DOWN,tagtoright

# ============================================
# Workspaces (1-9) - Numbered tags
# SUPER+1-9 to view workspace 1-9, SUPER+SHIFT+1-9 to move window
# ============================================
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# ============================================
# Monitor Navigation
# ============================================
bind=SUPER+CTRL,Left,focusmon,left
bind=SUPER+CTRL,Right,focusmon,right

bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Right,tagmon,right

# ============================================
# Window States & Actions
# ============================================

# Window Resizing
bind=SUPER,equal,resizewin,5,0
bind=SUPER,minus,resizewin,-5,0
bind=SUPER+CTRL,equal,resizewin,0,5
bind=SUPER+CTRL,minus,resizewin,0,-5

bind=SUPER,W,togglefloating

# Toggle overview
bind=ALT,Tab,toggleoverview,
bind=SUPER,Tab,focusstack,next

# Logout menu (Noctalia-style)
bind=SUPER,X,spawn,python3 $HOME/.config/waybar/scripts/logout-menu.py

# Fullscreen and maximize
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=ALT,a,togglemaximizescreen,

# Minimize/restore
bind=SUPER,I,minimized,
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER+SHIFT,o,toggleoverlay,
bind=SUPER+SHIFT,g,toggleglobal,

# Scratchpad
bind=ALT,z,toggle_scratchpad

# ============================================
# Screenshot
# ============================================
bind=SUPER+SHIFT,S,spawn,$HOME/.config/mango/bin/screenshot.sh

# ============================================
# Gaps & Layout
# ============================================
bind=CTRL,space,switch_layout
bind=CTRL+SHIFT,space,spawn,python3 $HOME/.config/mango/bin/layout-picker.py
# bind=CTRL,s,setlayout,scroller
# bind=CTRL,d,setlayout,center_tile
# bind=CTRL,a,setlayout,tile

# Scroller layout
bind=SUPER+ALT,f,set_proportion,1.0
bind=ALT,space,switch_proportion_preset,
bind=SUPER+SHIFT,c,scroller_stack,right
bind=SUPER,c,scroller_stack,left


# Gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps
bind=SUPER+SHIFT,A,spawn,$HOME/.config/mango/bin/toggle-outer-gaps.sh

# ============================================
# Mouse Button Bindings
# ============================================
mousebind=SUPER,btn_left,moveresize,curmove
# mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# ============================================
# Axis Bindings (Mouse wheel)
# ============================================
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# ============================================
# Touchpad Gesture Bindings
# ============================================
# 4-finger swipe: Switch workspaces (like niri)
gesturebind=none,up,4,viewtoright,0
gesturebind=none,down,4,viewtoleft,0

# 3-finger swipe: Switch window focus
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
