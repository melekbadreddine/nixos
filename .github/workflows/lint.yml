name: "Lint & Quality"
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v27
    - name: Flake Check (Evaluation)
      run: nix flake check --accept-flake-config --no-update-lock-file
    - name: Format Check (Alejandra)
      run: nix run nixpkgs#alejandra -- --check .
    - name: Deadnix (Unused Code)
      run: nix run nixpkgs#deadnix -- --fail .
