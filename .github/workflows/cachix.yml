name: "Cachix Binary Cache"
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v27
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@v15
      with:
        name: melek-nixos
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: Build NixOS VM Profile
      run: nix build .#nixosConfigurations.vm.config.system.build.toplevel --accept-flake-config --no-update-lock-file
    - name: Build Home Manager
      run: nix build .#homeConfigurations."melek@vm".activationPackage --accept-flake-config --no-update-lock-file
